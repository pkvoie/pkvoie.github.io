name: Publier la version d'essai
# Tâche ponctuelle : remplace l'APK de la release « essai » par a-publier/PKVoie-essai.apk, puis se retire.
on:
  push:
    branches: [main]
    paths: ['a-publier/PKVoie-essai.apk']
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remplacer l'APK de la release « essai »
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload essai a-publier/PKVoie-essai.apk --clobber -R "$GITHUB_REPOSITORY"
      - name: Retirer le fichier et cette tâche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q -r a-publier .github/workflows/publier-essai.yml
          git commit -q -m "Retrait de la tâche de publication (terminée)"
          git push -q origin HEAD:main
