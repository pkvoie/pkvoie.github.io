name: Nettoyage unique (retrait de l'ancienne version publique)

# Tâche à usage unique : retire la version complète publiée par erreur en public,
# les anciennes étiquettes pointant vers le code, et republie la version d'essai sur l'historique propre.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nettoyage.yml']

permissions:
  contents: write

jobs:
  nettoyage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Récupérer l'APK d'essai actuel
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release download essai -p 'PKVoie-essai.apk' -D /tmp/apk
      - name: Retirer les anciennes releases, étiquettes et branches
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete test --yes --cleanup-tag || true
          gh release delete essai --yes --cleanup-tag || true
          git push origin --delete sonde sonde-out test essai || true
      - name: Republier la version d'essai
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create essai /tmp/apk/PKVoie-essai.apk --target main \
            --title "PKVoie – version d'essai (jusqu'au 2026-12-13)" \
            --notes "Version d'essai à distribuer : elle se bloque automatiquement après le 2026-12-13. Outil d'aide au repérage, ne remplace pas les procédures de sécurité." --prerelease
          git ls-remote origin
